name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # pyproject [tool.uv] package=false: deps only, project is imported via
      # pytest pythonpath. --frozen guarantees the committed uv.lock is used.
      - name: Install locked dependencies
        run: uv sync --frozen --extra clinical --extra tests

      # testpaths (pyproject.toml) = medical_normalizer, clinical_engine,
      # regimen, review_workbench, src/tests — includes
      # test_build_reproducibility (antibiotic_calc.html rebuild gate).
      - name: Run test suite
        run: uv run --no-sync python -m pytest -q

      - name: Validate shipped DB (120 recs / regimens / scenarios)
        run: npm run validate

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
