name: CodeQL

# Static analysis of the Python (engine, pipeline, build scripts) and JavaScript
# (server.js, sw.js, the calculator template's inline script, db/validate_db.js)
# code paths. Public repository → GitHub code scanning is free; findings land in
# the Security tab, nothing is changed automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC — picks up new CodeQL queries

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # generated/ and the archival dashboard bundle are not maintained code
          config: |
            paths-ignore:
              - generated
              - audit-site/dist
              - vendor
              - docs/history

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
