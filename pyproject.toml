[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "antibio-pipeline"
version = "0.1.0"
description = "ANTIBIO knowledge base pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "orjson>=3.11,<4",
    "psutil>=7,<8",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
    "rich>=14,<16",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
clinical = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
]
extraction = [
    "pymupdf==1.24.10",
    "pillow>=11,<13",
    "docling==2.112.0",
    "mineru==3.4.4",
    "tqdm>=4.67.1,<5",
]
layout = [
    "albumentations>=2,<3",
    "doclayout-yolo==0.0.4",
    "matplotlib~=3.9.2",
    "rapid-table==3.0.2",
    "seaborn>=0.13,<1",
    "table-transformer==1.0.6",
]
semantic = [
    "huggingface-hub>=0.36,<1",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.57.6",
]
tests = [
    "pillow>=11,<13",
    "pymupdf==1.24.10",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "respx>=0.23,<1",
]
development = [
    "mypy>=1.19,<3",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false
# table-transformer 1.0.6 pins old tqdm/Pillow while current MinerU/Docling
# require newer versions. Runtime uses stable public APIs. These explicit metadata
# overrides must remain protected by layout + table + MinerU clean-env smoke tests.
override-dependencies = [
    "pillow>=11,<13",
    "tqdm>=4.67.1,<5",
]

[tool.ruff]
# Audit 2026-10-14 (D-1): the CI lint gate is pyflakes (`F`) + syntax errors
# (`E9`). Round 3 removed every unused import / redefinition / placeholder-less
# f-string outside the FROZEN `medical_normalizer/` (which is excluded from the
# style rules below rather than auto-fixed). Dead local assignments (F841) are
# enforced for engine and pipeline code; legacy tooling and tests carry
# documented exceptions.
line-length = 120
target-version = "py312"
extend-exclude = ["tmp", "generated/*/page_*", "audit-site"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# FROZEN — must not be edited for style (AGENTS.md §14); F821/F7/E9 still apply.
"medical_normalizer/**" = ["F401", "F541", "F811", "F841"]
# Test idioms: `fastapi = pytest.importorskip(...)`, side-effect calls kept by name.
"**/tests/**" = ["F841"]
"tests/**" = ["F841"]
# Legacy / archival tooling with dead locals that is not worth touching.
"main.py" = ["F841"]
"generated/**" = ["F841"]
"dose_verification_sandbox/**" = ["F841"]
"src/pipeline/extraction/layout.py" = ["F841"]

[tool.pytest.ini_options]
# Milestone 13: repo root on the path so `clinical_engine` / `medical_normalizer`
# import under a bare `pytest` run.
pythonpath = [".", "src/pipeline", "src"]
# Default `pytest` now covers the delivered medical subsystems (was src/tests only).
testpaths = [
    "medical_normalizer/tests",
    "clinical_engine/tests",
    "clinical_engine/regimen/tests",
    "clinical_engine/review_workbench/tests",
    "src/tests",
]
markers = [
    "unit: isolated deterministic unit tests",
    "integration: multi-component integration tests",
    "corpus: requires external clinical corpus",
    "ml: requires heavyweight ML dependencies/models",
    "slow: long-running tests",
    "clinical: clinical-domain behaviour tests",
    "golden: source-governed golden dataset tests",
    "security: security policy tests",
]
